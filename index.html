<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 25/09 (Eduardo: "traducao automatica do navegador bagunca as
         letras"). O tradutor do Chrome injeta <font> dentro dos spans
         que as animacoes de texto (LineReveal/GSAP) quebram em linhas e
         caracteres — vira sopa de letrinhas. O site ja e nativamente
         PT/EN (toggle no rodape), entao maquina de traduzir nao soma:
         notranslate desliga a barra do Google Translate na pagina. -->
    <meta name="google" content="notranslate" />
    <!-- Pre-paint: aplica o tema escolhido antes do bundle para nao piscar. -->
    <script>
      try { if (localStorage.getItem("mf-theme") === "dark") document.documentElement.dataset.skin = "dark"; } catch (e) {}
    </script>

    <!-- Marca propria. Antes apontava para o logo do Base44, o que fazia
         o site exibir a marca da plataforma na aba do navegador. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/manifest.json" />


    <!-- A arte da hero e o maior elemento da primeira tela; pre-carregar
         tira o atraso entre a fonte pintar e a imagem aparecer. -->
    <link
      rel="preload"
      as="image"
      href="/art/hero.webp"
      imagesrcset="/art/hero@800.webp 800w, /art/hero.webp 1600w"
      imagesizes="(max-width: 900px) 92vw, 1100px"
    />

    <meta name="description" content="I design and build complete web systems — brand, product and data as one — solo, using an orchestrated AI workflow. Serving clients in Ireland, the UK and worldwide." />
    <meta name="keywords" content="web consultancy Ireland, web design Dublin, freelance web developer UK, design engineer, custom business systems, AI automation consultant, remote web consultant London, systems development" />

    <!-- Dados estruturados (Eduardo 17/09): entidade + servicos que o
         Google le para painel de conhecimento e Search Console. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "https://mirandafaria.com.br/#org",
          "name": "Miranda Faria",
          "slogan": "Consultoria & Tecnologia",
          "url": "https://mirandafaria.com.br/",
          "description": "Design engineer e consultoria em tecnologia: sistemas de gestão, desenvolvimento web, design e automação com IA — do diagnóstico à entrega, uma só mão.",
          "founder": { "@type": "Person", "name": "Eduardo Miranda" },
          "areaServed": ["IE", "GB", "Dublin", "London", "BR", "Minas Gerais"],
          "priceRange": "$$",
          "knowsLanguage": ["pt-BR", "en"],
          "makesOffer": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sistemas & Gestão" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Desenvolvimento Web" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Design & Identidade" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Automação com IA" } }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://mirandafaria.com.br/#site",
          "url": "https://mirandafaria.com.br/",
          "name": "Miranda Faria",
          "inLanguage": ["pt-BR", "en"],
          "publisher": { "@id": "https://mirandafaria.com.br/#org" }
        }
      ]
    }
    </script>
    <meta name="theme-color" content="#F5F1EA" />
    <title>Miranda Faria — Design Engineer &amp; Creative Technologist</title>

    <!-- Cartao de link: e a primeira impressao quando o portfolio e
         colado no LinkedIn ou no WhatsApp, antes do site abrir. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miranda Faria" />
    <meta property="og:title" content="Miranda Faria — Design Engineer &amp; Creative Technologist" />
    <meta property="og:description" content="Brand, product and data as one system — designed and shipped by one person." />
    <meta property="og:image" content="https://mirandafaria.com.br/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- SEO do dominio: o site e uma SPA de duas rotas (/pt, /en) —
         canonical fixa a raiz, hreflang declara os dois idiomas. -->
    <link rel="canonical" href="https://mirandafaria.com.br/pt" />
    <!-- hreflang vivem no SiteLayout, atualizados por rota; aqui so causavam
         duplicatas com x-default conflitante no head renderizado. -->

    <meta property="og:url" content="https://mirandafaria.com.br/pt" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Dado estruturado: quem assina o site — pessoa, nao empresa. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Miranda Faria",
      "url": "https://mirandafaria.com.br",
      "jobTitle": "Design Engineer",
      "description": "Design, development and data systems — designed and shipped by one person.",
      "knowsAbout": ["Brand Identity", "Web Development", "Data Systems", "Creative Technology"]
    }
    </script>
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mirandafaria.com.br/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
